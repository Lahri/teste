services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    environment:
      ORACLE_PASSWORD: dev_sys_password_only
      APP_USER: painel_demandas
      APP_USER_PASSWORD: dev_local_only
    ports:
      - "1521:1521"
    volumes:
      - ./backend/schema.sql:/opt/schema/schema.sql:ro
      - ./backend/docker-init.sql:/container-entrypoint-initdb.d/01_schema.sql:ro
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 5s
      start_interval: 5s

  backend:
    build: ./backend
    env_file: ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      oracle:
        condition: service_healthy

volumes:
  oracle_data:
